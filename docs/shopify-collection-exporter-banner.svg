<svg xmlns="http://www.w3.org/2000/svg" width="1984" height="793" viewBox="0 0 1984 793" role="img" aria-labelledby="title desc">
<title id="title">Shopify Collection Exporter Lite</title>
<desc id="desc">A dark technical banner showing Shopify collection data flowing through parse and CSV export stages.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121d"/><stop offset="1" stop-color="#091827"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39a8ff"/><stop offset=".48" stop-color="#35d36d"/><stop offset="1" stop-color="#ffad45"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102130"/><stop offset="1" stop-color="#0b1824"/></linearGradient>
  <pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse"><path d="M55 0H0V55" fill="none" stroke="#254055" stroke-opacity=".18"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1984" height="793" rx="28" fill="url(#bg)"/>
<rect width="1984" height="793" rx="28" fill="url(#grid)"/>
<rect x="45" y="58" width="1894" height="9" rx="5" fill="url(#accent)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="118" y="221" fill="#88a2b9" font-size="31" font-weight="700" letter-spacing="7">PYTHON E-COMMERCE DATA</text>
  <text x="118" y="328" fill="#f7fafc" font-size="60" font-weight="800">Shopify Collection Exporter Lite</text>
  <text x="118" y="411" fill="#91aac0" font-size="34">Selected Shopify collections exported to variant-level CSV.</text>

  <g transform="translate(118 468)">
    <rect width="238" height="74" rx="37" fill="#101e2b" stroke="#2a4051" stroke-width="2"/>
    <text x="119" y="47" text-anchor="middle" fill="#dce8f2" font-size="26" font-weight="700">Requests</text>
    <rect x="264" width="228" height="74" rx="37" fill="#101e2b" stroke="#2a4051" stroke-width="2"/>
    <text x="378" y="47" text-anchor="middle" fill="#dce8f2" font-size="26" font-weight="700">argparse</text>
    <rect x="518" width="198" height="74" rx="37" fill="#101e2b" stroke="#2a4051" stroke-width="2"/>
    <text x="617" y="47" text-anchor="middle" fill="#dce8f2" font-size="26" font-weight="700">pytest</text>
  </g>

  <g transform="translate(1137 156)" filter="url(#shadow)">
    <rect width="756" height="444" rx="32" fill="url(#panel)" stroke="#2b3c4a" stroke-width="2"/>
    <g transform="translate(52 51)">
      <rect width="205" height="122" rx="22" fill="#102234" stroke="#2f9df4" stroke-width="2"/>
      <text x="103" y="49" text-anchor="middle" fill="#4daeff" font-size="26" font-weight="800">COLLECTIONS</text>
      <text x="103" y="91" text-anchor="middle" fill="#d7e4ee" font-size="23">URL or file</text>
      <text x="250" y="75" fill="#7d91a2" font-size="54">→</text>
      <rect x="307" width="155" height="122" rx="22" fill="#0b291d" stroke="#27b957" stroke-width="2"/>
      <text x="385" y="49" text-anchor="middle" fill="#39cd6c" font-size="27" font-weight="800">PARSE</text>
      <text x="385" y="91" text-anchor="middle" fill="#d7e4ee" font-size="23">14 fields</text>
      <text x="470" y="75" fill="#7d91a2" font-size="54">→</text>
      <rect x="518" width="134" height="122" rx="22" fill="#2a2012" stroke="#d98225" stroke-width="2"/>
      <text x="585" y="49" text-anchor="middle" fill="#f0a13c" font-size="26" font-weight="800">EXPORT</text>
      <text x="585" y="91" text-anchor="middle" fill="#d7e4ee" font-size="23">CSV</text>
    </g>
    <g transform="translate(52 226)">
      <rect width="652" height="165" rx="24" fill="#070d18" stroke="#304252" stroke-width="2"/>
      <circle cx="38" cy="54" r="10" fill="#35c960"/>
      <text x="69" y="64" fill="#bccbda" font-size="25">input modes</text>
      <text x="610" y="64" text-anchor="end" fill="#f7fafc" font-size="28" font-weight="800">2</text>
      <circle cx="38" cy="116" r="10" fill="#399ff0"/>
      <text x="69" y="126" fill="#bccbda" font-size="25">tests passed</text>
      <text x="610" y="126" text-anchor="end" fill="#f7fafc" font-size="28" font-weight="800">5</text>
    </g>
  </g>
</g>
</svg>